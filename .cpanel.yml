---
# Despliegue en cPanel para Refugio Espartanos.
#
# La cuenta tiene 768 MB para TODOS los procesos. Passenger mantiene los procesos viejos
# sirviendo mientras corre esto, asi que compilar aca sumaba los ~600 MB que necesita `tsc` a
# los ~135 MB por proceso que ya estan ocupados: el build podia quedarse sin memoria o, peor,
# matar a los procesos que estaban atendiendo reservas.
#
# Por eso solo se instalan las dependencias de PRODUCCION y se verifica que los artefactos ya
# compilados esten presentes. `apps/api/dist` y `apps/web/dist` se generan antes de subir, en
# la maquina de desarrollo o en integracion continua:
#
#   npm ci --include=dev && npm run build:cpanel
#
deployment:
  tasks:
    - export APP_ROOT=$PWD
    - export FRONTEND_DEPLOYPATH=$HOME/public_html/cuartel.espartanos.cl
    - test "$FRONTEND_DEPLOYPATH" = "/home/espartanoscl/public_html/cuartel.espartanos.cl" || { echo "RUTA DE FRONTEND NO AUTORIZADA"; exit 1; }
    - case "$APP_ROOT" in "$HOME/public_html"*) echo "EL BACKEND NO PUEDE VIVIR EN PUBLIC_HTML"; exit 1;; esac
    - /bin/mkdir -p "$FRONTEND_DEPLOYPATH"

    # Los artefactos deben venir compilados. Si faltan, se detiene aca en vez de arrancar una
    # aplicacion a medias.
    - test -f "$APP_ROOT/apps/api/dist/main.js" || { echo "FALTA apps/api/dist/main.js — compila antes de desplegar"; exit 1; }
    - test -f "$APP_ROOT/apps/web/dist/index.html" || { echo "FALTA apps/web/dist/index.html — compila antes de desplegar"; exit 1; }
    - test -f "$APP_ROOT/apps/web/dist/.htaccess" || { echo "FALTA apps/web/dist/.htaccess"; exit 1; }

    # Git Deployment no activa automaticamente el entorno creado por Setup Node.js App.
    # Sin este PATH, `npm` puede usar otra version de Node o no existir durante el despliegue.
    - export NODE_BIN="$HOME/nodevenv/repositories/spartanoshub/22/bin"
    - test -x "$NODE_BIN/node" && test -x "$NODE_BIN/npm" || { echo "FALTA EL ENTORNO NODE 22 DE CPANEL"; exit 1; }
    - export PATH="$NODE_BIN:$PATH"
    - node --version

    # Antes: `npm ci --omit=dev` conservaba miles de archivos en $HOME/.npm. El instalador
    # mantiene la misma instalacion productiva, pero usa una cache temporal y siempre la borra.
    # Limpia archivos de la web con mas de 30 dias que ninguna version vigente usa. Sin esto se
    # acumulan en cada despliegue hasta que el control de inodos detiene el siguiente.
    - /bin/bash scripts/deploy/prune-old-assets.sh
    - /bin/bash scripts/deploy/check-inodes.sh
    - /bin/bash scripts/deploy/install-production-dependencies.sh
    - /bin/bash scripts/deploy/check-inodes.sh
    - npm run check:production-env

    # TypeORM registra cada migracion aplicada; volver a desplegar solo ejecuta las pendientes.
    # La aplicacion no se reinicia ni el frontend se publica si la base de datos queda incompleta.
    - npm run migration:run:prod

    # Crea los directorios de datos y traslada los del nombre anterior si todavia existen.
    # Corre antes de reiniciar: la aplicacion nueva ya encuentra los archivos en su sitio.
    - /bin/bash scripts/deploy/migrate-data-directories.sh
    - /bin/mkdir -p "$APP_ROOT/tmp" "$APP_ROOT/logs"
    - /bin/chmod 750 "$APP_ROOT/tmp" "$APP_ROOT/logs"

    # No borres assets con hash ni workbox antiguos durante deploy.
    # Navegadores con service worker/index.html anterior pueden seguir pidiendo esos archivos
    # por unos minutos; si faltan, Apache devuelve index.html y el navegador falla por MIME.
    - /bin/mkdir -p "$FRONTEND_DEPLOYPATH/assets"
    - /bin/rm -f "$FRONTEND_DEPLOYPATH/index.html" "$FRONTEND_DEPLOYPATH/sw.js" "$FRONTEND_DEPLOYPATH/registerSW.js" "$FRONTEND_DEPLOYPATH/manifest.webmanifest"
    - /bin/cp -R apps/web/dist/. "$FRONTEND_DEPLOYPATH"

    - /bin/touch "$APP_ROOT/tmp/restart.txt"
    - /bin/touch "$APP_ROOT/app.js"

    # El `.htaccess` del subdominio de la API lo regenera CloudLinux si alguien recrea el
    # subdominio, y se lleva por delante los dos anadidos manuales: el `RewriteEngine Off` que
    # impide heredar las reglas de WordPress —sin el, la API responde 500 sin dejar rastro en
    # `passenger-error.log`— y la cabecera de version oculta. Va despues del reinicio para poder
    # comprobar la API de verdad; si algo sale mal, el propio script restaura su respaldo.
    - /bin/bash scripts/deploy/asegurar-htaccess-refugio.sh

    # Las tareas programadas, con el despliegue y no a mano.
    #
    # Instalarlas era un paso aparte que alguien tenia que acordarse de repetir cuando se agregaba
    # una. No se repitio: `leads-parados` existia en la API desde hacia meses, su correo estaba
    # escrito, y la linea del crontab nunca se puso. No fallo nada; simplemente ningun responsable
    # recibio aviso de que una ficha llevaba dias parada.
    #
    # El instalador reemplaza sus propias lineas y conserva las ajenas, asi que correrlo en cada
    # despliegue deja el crontab igual cuando no hubo cambios. Va al final, despues de reiniciar:
    # las tareas llaman a la API y no tiene sentido programarlas contra una que todavia no levanto.
    #
    # No detiene el despliegue si falla. Una aplicacion publicada sin recordatorios funciona; una
    # que no se publico porque el crontab dio error, no.
    # Entre comillas y sin dos puntos seguidos de espacio dentro del texto: cPanel lee este
    # archivo como YAML, y un `: ` en un escalar sin comillas lo convierte en un mapa. La linea
    # llego a la consola como HASH(0x...) y la tarea no corrio, con el despliegue marcado en 2.
    - "/bin/bash scripts/deploy/setup-crontab.sh https://refugio.espartanos.cl || echo CRONTAB-FALLO-revisalo-con-scripts-deploy-setup-crontab-sh"
