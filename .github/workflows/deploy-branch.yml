name: Rama de despliegue

# Publica en la rama `deploy` el codigo mas los artefactos ya compilados, que es lo que
# cPanel necesita para desplegar.
#
# El problema que resuelve: `.cpanel.yml` se detiene si no encuentra `apps/api/dist/main.js` y
# `apps/web/dist/index.html`. Compilar en el servidor no es opcion: la cuenta tiene 768 MB para
# todos los procesos y `tsc` necesita unos 600 MB. Passenger mantiene los procesos viejos
# atendiendo mientras corre el despliegue, asi que compilar alla puede matar a los que estan
# atendiendo reservas. Por eso se compila aca, en una maquina que si tiene memoria.
#
# OJO AL LEER ESTE ARCHIVO
#
# Este encabezado decia que `dist/` estaba en `.gitignore` y que versionarlo en `main` no era
# opcion. **Las dos cosas dejaron de ser ciertas.** El `.gitignore` ahora versiona `dist/` a
# proposito —lo explica ahi mismo— y `main` lleva unos 870 archivos compilados.
#
# La consecuencia practica es que hoy conviven dos caminos para lo mismo:
#
#   1. `main` ya contiene `dist/`, compilado antes de subir con `npm run build:cpanel`.
#   2. Este workflow recompila y publica la rama `deploy`.
#
# El mecanismo sigue siendo correcto: `git add -f` sobre archivos ya versionados no molesta, y
# recompilar garantiza que lo publicado corresponde al commit. Pero **es trabajo repetido**, y
# vale la pena decidir con cual quedarse en vez de mantener los dos por inercia.
#
# En cPanel, `Git Version Control` debe apuntar a la rama `deploy`, no a `main`.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Solo lo que hace falta para empujar la rama. `GITHUB_TOKEN` lo emite Actions en cada
# ejecucion, asi que no hay ningun secreto que guardar ni que rotar.
permissions:
  contents: write

# Dos despliegues seguidos no deben cruzarse empujando la misma rama.
concurrency:
  group: deploy-branch
  cancel-in-progress: true

# Como en `ci.yml`: las variables van en los pasos que las piden, no a nivel de workflow. Ver
# la explicacion completa alla; en resumen, una clave de mas alcanzo a `test:api` y rompio seis
# pruebas que no la necesitaban.

jobs:
  publicar:
    runs-on: ubuntu-latest

    # Este job tiene su propia puerta y no depende de que `ci.yml` haya terminado.
    #
    # Los dos se disparan a la vez con el `push` a `main`, asi que encadenarlos exigiria cambiar
    # cuando se dispara el despliegue. Duplicar la comprobacion cuesta unos minutos de Actions y
    # a cambio garantiza que **el job que genera `deploy` la haya hecho el mismo**, en vez de
    # confiar en otro que corre en paralelo y podria no haber llegado.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: espartanos_ci
          MARIADB_DATABASE: espartanos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Confirmar el motor de base de datos
        run: |
          version=$(mysql -h 127.0.0.1 -P 3306 -uroot -pespartanos_ci -N -B -e 'SELECT VERSION()')
          echo "Motor: $version"
          case "$version" in
            11.4*MariaDB*) ;;
            *) echo "Se esperaba MariaDB 11.4 y respondio: $version"; exit 1 ;;
          esac

      - name: Migraciones sobre una base limpia
        run: npm run migration:run
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USERNAME: root
          DB_PASSWORD: espartanos_ci
          DB_DATABASE: espartanos_test

      # Las pruebas corren antes de compilar: una rama de despliegue con codigo que no pasa
      # las pruebas es peor que no tener rama, porque parece lista para subir.
      - name: Pruebas unitarias
        run: |
          npm run test:api
          npm run test:web

      # Las de extremo a extremo son las que cubren el aislamiento entre empresas cliente, los
      # permisos y las puertas publicas. Sin ellas aca, la rama podia generarse con una fuga de
      # datos entre clientes intacta: las unitarias no la ven.
      #
      # Van en su propio paso porque son las unicas que necesitan la base, y asi las unitarias
      # corren sin variables, igual que en cualquier maquina sin `.env`.
      - name: Pruebas de extremo a extremo
        run: npm run test:e2e
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USERNAME: root
          DB_PASSWORD: espartanos_ci
          E2E_DB_DATABASE: espartanos_test

      - name: Compilar
        run: npm run build:cpanel
        env:
          # Valores publicos y fijos: el frontend nunca debe intentar resolver /api en Cuartel.
          VITE_API_URL: https://refugio.espartanos.cl/api
          VITE_APP_PUBLIC_URL: https://cuartel.espartanos.cl

      # La misma comprobacion que hace `.cpanel.yml`, pero aca, donde fallar es gratis.
      - name: Verificar artefactos
        run: |
          test -f apps/api/dist/main.js
          test -f apps/web/dist/index.html
          test -f apps/web/dist/.htaccess

      - name: Publicar rama deploy
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `git add -f` sin rutas tambien agregaria node_modules. Primero se prepara el codigo
          # normal y luego se fuerzan exclusivamente los artefactos ignorados que cPanel usa.
          git add -A
          git add -f apps/api/dist apps/web/dist packages/shared/dist
          if git ls-files --cached | grep -Eq '(^|/)node_modules/'; then
            echo "node_modules no puede formar parte de deploy"
            exit 1
          fi

          # El despliegue validado usa 2.587 archivos. Este margen permite crecimiento normal,
          # pero detiene copias, caches o artefactos masivos antes de consumir inodos en cPanel.
          tracked_files="$(git ls-files --cached | wc -l | tr -d ' ')"
          if [ "$tracked_files" -gt 4000 ]; then
            echo "deploy contiene $tracked_files archivos; el limite permanente es 4000"
            exit 1
          fi
          echo "Archivos versionados en deploy: $tracked_files/4000"

          tree="$(git write-tree)"
          message="Despliegue de ${GITHUB_SHA::7}

          Compilado por Actions desde main. La historia funcional esta en main; esta rama
          conserva una linea minima para que cPanel pueda actualizarla sin force-push."

          # cPanel solo puede avanzar por fast-forward. Cada despliegue debe ser hijo del
          # anterior; una rama huerfana y forzada funciona una vez, pero rompe la siguiente.
          if git ls-remote --exit-code --heads origin deploy >/dev/null; then
            git fetch --no-tags --depth=1 origin deploy
            parent="$(git rev-parse FETCH_HEAD)"
            commit="$(printf '%s\n' "$message" | git commit-tree "$tree" -p "$parent")"
          else
            commit="$(printf '%s\n' "$message" | git commit-tree "$tree")"
          fi
          git push origin "$commit:refs/heads/deploy"

      - name: Resumen
        run: |
          {
            echo "### Rama \`deploy\` actualizada"
            echo ""
            echo "Origen: \`${GITHUB_SHA::7}\` de main."
            echo ""
            echo "En cPanel: **Update from Remote** y luego **Deploy HEAD Commit**."
          } >> "$GITHUB_STEP_SUMMARY"
