name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Variables comunes a los pasos que hablan con la base.
#
# Ninguna es secreta y ninguna debe serlo: `validateEnvironment()` solo exige valores fuertes
# cuando `NODE_ENV=production`, y acá vale `test`. Guardarlas como secretos de GitHub daría una
# falsa sensación de custodia sobre credenciales de una base que se destruye al terminar el job.
env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USERNAME: root
  DB_PASSWORD: espartanos_ci
  DB_DATABASE: espartanos_test
  E2E_DB_DATABASE: espartanos_test
  DB_SSL: 'false'
  NODE_ENV: test
  JWT_SECRET: ci-jwt-secret-solo-para-integracion-continua
  INTEGRATION_ENCRYPTION_KEY: ci-integration-key-solo-para-integracion
  OAUTH_STATE_SECRET: ci-oauth-state-solo-para-integracion-continua
  CRON_SECRET: ci-cron-secret-solo-para-integracion-continua
  UPLOAD_DIR: /tmp/espartanos-uploads

jobs:
  quality:
    runs-on: ubuntu-latest

    # MariaDB, no MySQL, y con la version de referencia.
    #
    # Las migraciones crean columnas `uuid` **nativas**, un tipo que MariaDB tiene desde 10.7 y
    # que no existe en el catalogo de MySQL. Produccion y una migracion limpia coinciden en eso.
    # Ver `docs/operacion/motor-de-base-de-datos.md`.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: espartanos_ci
          MARIADB_DATABASE: espartanos_test
        ports:
          - 3306:3306
        # Sin esto los pasos arrancan contra un contenedor que todavia no acepta conexiones, y
        # el fallo aparece como un error de migracion en vez de como lo que es.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      - run: npm run lint:shared
      - run: npm run lint:api
      - run: npm run lint:web

      - name: Confirmar el motor de base de datos
        run: |
          version=$(mysql -h 127.0.0.1 -P 3306 -uroot -pespartanos_ci -N -B -e 'SELECT VERSION()')
          echo "Motor: $version"
          case "$version" in
            11.4*MariaDB*) ;;
            *) echo "Se esperaba MariaDB 11.4 y respondio: $version"; exit 1 ;;
          esac

      # Desde una base vacia, no desde un volcado: es la unica forma de comprobar que el sistema
      # se puede levantar de cero, que es lo que hara el proximo servidor.
      - name: Migraciones sobre una base limpia
        run: npm run migration:run

      - run: npm run test:api
      - run: npm run test:web

      # Toda la carpeta `test/e2e`, sin lista aparte: un archivo nuevo entra en la puerta de
      # calidad por existir, sin que nadie tenga que acordarse de anotarlo en otro sitio.
      - name: Pruebas de extremo a extremo
        run: npm run test:e2e

      - run: npm run build:api
      - run: npm run build:web
