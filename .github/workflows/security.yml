name: Security scans

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 0' # Sundays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  gitleaks:
    name: Detect secrets with Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  osv:
    name: Scan dependencies with OSV-Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Scan dependency manifests and lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --recursive
            ./

  zap-cuartel-production:
    name: ZAP Baseline — Cuartel production (passive)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Passive baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://cuartel.espartanos.cl/'
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-cuartel-production

  zap-refugio-production:
    name: ZAP Baseline — Refugio health endpoint (passive)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Passive baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://refugio.espartanos.cl/api/health'
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-refugio-production

  zap-cuartel-staging:
    name: ZAP Baseline — Cuartel staging (passive)
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.ZAP_STAGING_CUARTEL_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Passive baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.ZAP_STAGING_CUARTEL_URL }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-cuartel-staging

  zap-refugio-staging:
    name: ZAP Baseline — Refugio staging (passive)
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.ZAP_STAGING_REFUGIO_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Passive baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.ZAP_STAGING_REFUGIO_URL }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-refugio-staging
